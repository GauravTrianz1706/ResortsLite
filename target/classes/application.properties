# ResortsLite - Modernized Configuration for Java 17 / Spring Boot 3.x
spring.application.name=ResortsLite

# Dynamic port assignment for cloud environments (ECS/EKS)
# Use ${PORT:8080} to allow environment variable override
server.port=${PORT:8080}

# Database configuration - H2 in-memory for development
# For production, externalize to AWS Parameter Store or Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Service endpoints - externalized for cloud deployment
# These should be configured via environment variables or service discovery
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# Logging configuration
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG

# Actuator endpoints (if needed)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
