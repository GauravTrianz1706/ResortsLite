# ResortsLite - Application Configuration (Java 21 / Spring Boot 3.2.x)
spring.application.name=ResortsLite

# Server port — override via SERVER_PORT env-var in ECS/EKS
server.port=${SERVER_PORT:8080}

# H2 in-memory datasource (replace with externalised credentials in production)
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Initialise schema on startup
spring.sql.init.mode=always

# H2 web console (disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# External service endpoints — override via environment variables in cloud deployments
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}
