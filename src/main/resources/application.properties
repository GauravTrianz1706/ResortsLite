# ResortsLite — Cloud-Native Configuration (AWS)
spring.application.name=ResortsLite

# ─────────────────────────────────────────────────────────────────────────────
# Server Port — injected from environment variable SERVER_PORT at runtime.
# Replaces hard-coded port 8080 (cr-java-0077 / czr-port-001).
# ECS/EKS/Elastic Beanstalk injects SERVER_PORT dynamically.
# ─────────────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# DataSource — credentials are managed by AWS Secrets Manager (cr-java-0069).
# The actual username/password are loaded at runtime via SecretsManagerClient.
# The JDBC URL is injected from the environment variable DB_URL.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────────────────────────────────────────
# AWS Secrets Manager — secret name for DB credentials (cr-java-0069)
# ─────────────────────────────────────────────────────────────────────────────
cloud.aws.secrets.db-secret-name=${DB_SECRET_NAME:resorts-lite/db-credentials}

# ─────────────────────────────────────────────────────────────────────────────
# AWS SSM Parameter Store — parameter paths for environment-specific URLs (cr-java-0071)
# ─────────────────────────────────────────────────────────────────────────────
cloud.aws.ssm.payment-api-param=${PAYMENT_API_PARAM:/resorts-lite/payment-api-url}

# ─────────────────────────────────────────────────────────────────────────────
# Service endpoints — externalized from hard-coded values (cr-java-0071).
# Values are injected via environment variables in ECS/EKS task definitions.
# ─────────────────────────────────────────────────────────────────────────────
app.payment.endpoint=${PAYMENT_API_URL:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:http://notify.internal:7070/send}

# ─────────────────────────────────────────────────────────────────────────────
# Amazon S3 — bucket names for report and backup storage (cr-java-0061, cr-java-0062, cr-java-0063)
# Replaces hard-coded local file paths /var/legacy/reports/ and C:\ResortBackups\nightly\
# ─────────────────────────────────────────────────────────────────────────────
cloud.aws.s3.reports-bucket=${REPORTS_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.backup-bucket=${BACKUP_S3_BUCKET:resorts-lite-backups}

# ─────────────────────────────────────────────────────────────────────────────
# Amazon ElastiCache for Redis — Spring Session + distributed cache (cr-java-0065, cr-java-0067)
# Replaces HttpSession and static in-memory HashMap cache.
# REDIS_HOST and REDIS_PORT are injected by ECS/EKS at runtime.
# ─────────────────────────────────────────────────────────────────────────────
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resorts-lite:session

# Cache TTL settings (minutes)
app.cache.booking-ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}
app.session.ttl-minutes=${SESSION_TTL_MINUTES:30}

# ─────────────────────────────────────────────────────────────────────────────
# AWS Region — required by AWS SDK v2 clients
# ─────────────────────────────────────────────────────────────────────────────
cloud.aws.region.static=${AWS_REGION:us-east-1}
