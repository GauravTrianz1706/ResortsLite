# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077: Server port is now retrieved from AWS Parameter Store via environment variable
# Set SERVER_PORT environment variable in ECS/EKS task definition or Elastic Beanstalk configuration
# The default value (8080) is only used for local development
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge

# AWS S3 Configuration for cloud-native file storage
# Replace hard-coded file paths with S3 bucket storage
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=${AWS_S3_REPORTS_PREFIX:reports/}

# AWS Secrets Manager Configuration
# Database credentials are now retrieved from AWS Secrets Manager instead of hard-coded values
aws.secretsmanager.secret.name=${AWS_SECRETS_MANAGER_SECRET_NAME:resorts-lite/db-credentials}

# AWS Systems Manager Parameter Store Configuration
# Environment-specific URLs are retrieved from Parameter Store instead of hard-coded values
aws.parameterstore.inventory.url.name=${AWS_PARAMETER_STORE_INVENTORY_URL:/resorts-lite/inventory-service-url}


# FIXED cr-java-0065: Spring Session with Amazon ElastiCache for Redis
# Distributed session management for stateless, horizontally scalable application instances
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Amazon ElastiCache for Redis Configuration
# Redis endpoint should be set via environment variable pointing to ElastiCache cluster
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=true

# FIXED cr-java-0090: AWS Cognito Configuration for cloud-native authentication
# Replaces file-based authentication with AWS Cognito User Pools and Secrets Manager
# User credentials and authentication tokens are managed centrally by AWS Cognito
# Client secrets are stored securely in AWS Secrets Manager
aws.region=${AWS_REGION:us-east-1}
aws.cognito.userPoolId=${COGNITO_USER_POOL_ID:}
aws.cognito.clientId=${COGNITO_CLIENT_ID:}
# Client secret is retrieved from AWS Secrets Manager at runtime
# Secret name: ${COGNITO_CLIENT_SECRET_NAME:resortslite/cognito/client-secret}
