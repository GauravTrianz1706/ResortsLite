# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — externalised; override via SERVER_PORT environment variable
server.port=${SERVER_PORT:8080}

# PostgreSQL DataSource — all sensitive values externalised to environment variables.
# Set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD in the deployment environment
# (e.g., AWS Parameter Store / Secrets Manager, Kubernetes Secrets, ECS task definition).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP defaults tuned for PostgreSQL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL dialect for Spring JDBC
spring.sql.init.platform=postgresql

# Internal service endpoints — externalised to environment variables for cloud VPC routing
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify-svc:7070/send}
