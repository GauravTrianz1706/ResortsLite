# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# ---------------------------------------------------------------------------
# cr-java-0065: Spring Session — Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------
# All HTTP session state is now stored in Amazon ElastiCache for Redis via
# Spring Session, enabling stateless application instances and horizontal
# scaling without server affinity.
#
# Required AWS setup:
#   1. Create an Amazon ElastiCache for Redis cluster (cluster mode disabled
#      for single-node dev; cluster mode enabled for production HA).
#   2. Inject the following environment variables at runtime via:
#        - ECS task definition environment / secrets
#        - EKS: AWS Secrets Store CSI Driver or external-secrets operator
#        - Elastic Beanstalk: .ebextensions sourcing SSM parameters
#
#   REDIS_HOST  – ElastiCache primary endpoint hostname
#                 (default: localhost for local development only)
#   REDIS_PORT  – ElastiCache port (default: 6379)
#
# Session timeout is set to 30 minutes; adjust to match your security policy.
# ---------------------------------------------------------------------------
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
server.servlet.session.timeout=30m

# ---------------------------------------------------------------------------
# cr-java-0067: Amazon ElastiCache for Redis — Booking Cache TTL
# ---------------------------------------------------------------------------
# Replaces the unbounded static in-memory HashMap (bookingCache) in
# BookingController with Amazon ElastiCache for Redis. Each booking entry is
# stored with a TTL to prevent indefinite memory growth, stale data, and
# cross-instance inconsistencies.
#
# Required AWS setup:
#   1. The same Amazon ElastiCache for Redis cluster used by Spring Session
#      (cr-java-0065) is reused for booking cache entries — no additional
#      infrastructure is required.
#   2. Inject the following environment variable at runtime via:
#        - ECS task definition environment / secrets
#        - EKS: AWS Secrets Store CSI Driver or external-secrets operator
#        - Elastic Beanstalk: .ebextensions sourcing SSM parameters
#
#   BOOKING_CACHE_TTL – TTL for booking cache entries in minutes (default: 60)
#
# AWS SSM Parameter Store setup (recommended):
#   Parameter name : /resortslite/booking/cache-ttl-minutes
#   Parameter type : String
#   Example value  : 60
# ---------------------------------------------------------------------------
app.booking.cache.ttl-minutes=${BOOKING_CACHE_TTL:60}

# cr-java-0077: Hard-coded port 8080 replaced with environment variable SERVER_PORT.
# The SERVER_PORT value MUST be populated from AWS Systems Manager Parameter Store
# before deployment to ECS, EKS, or Elastic Beanstalk.
#
# AWS SSM Parameter Store setup:
#   Parameter name : /resortslite/server/port
#   Parameter type : String
#   Example value  : 8080
#
# Inject into the application at runtime via one of:
#   - ECS task definition: valueFrom SSM parameter ARN for SERVER_PORT
#   - EKS: AWS Secrets Store CSI Driver or external-secrets operator
#   - Elastic Beanstalk: .ebextensions sourcing SSM parameter into env property
#
# The default value (8080) is a local-dev fallback only — never used in cloud deployments.
server.port=${SERVER_PORT:8080}

# cr-java-0069: Hard-coded DB credentials removed from source code.
# Database credentials are now retrieved at startup from AWS Secrets Manager.
# Set the following environment variables in your ECS task definition / EKS secret / EC2 instance:
#
#   DB_SECRET_NAME  - Name or ARN of the Secrets Manager secret
#                     (default: resortslite/db/credentials)
#   AWS_REGION      - AWS region where the secret is stored (default: us-east-1)
#   DB_URL          - JDBC URL for the target database
#                     (default: jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1 for local dev)
#   DB_HOST         - Logical DB hostname exposed via app.db.host (default: localhost)
#
# The Secrets Manager secret must be a JSON object with keys: username, password
# Example secret value:
#   {"username":"admin","password":"<rotated-by-secrets-manager>"}
#
# Spring Boot datasource properties below are intentionally left without
# credentials — SecretsManagerConfig.java provides the DataSource bean.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}

app.db.host=${DB_HOST:localhost}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071: Inventory service URL externalised from hard-coded value in BookingController.
# This property is resolved at runtime from the environment variable INVENTORY_SERVICE_URL,
# which MUST be populated from AWS Systems Manager Parameter Store before deployment.
#
# AWS SSM Parameter Store setup:
#   Parameter name : /resortslite/inventory/service-url
#   Parameter type : String (or SecureString if the URL contains credentials)
#   Example value  : http://inventory-service.internal:8081/rooms/available
#
# Inject into the application at runtime via one of:
#   - ECS task definition environment variable: INVENTORY_SERVICE_URL -> SSM parameter reference
#   - EKS: AWS Secrets Store CSI Driver or external-secrets operator
#   - EC2: AWS Systems Manager Parameter Store + instance profile
#
# The default value below is a local-dev fallback only — never used in cloud deployments.
app.inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}

# ---------------------------------------------------------------------------
# cr-java-0090: Amazon Cognito — File-based Authentication Replacement
# ---------------------------------------------------------------------------
# Authentication credentials and user data are no longer stored in local files
# or generated via local hashing (MD5). Booking confirmation tokens are now
# issued by Amazon Cognito User Pool, providing centralized, encrypted, and
# auditable identity management.
#
# Required AWS setup:
#   1. Create an Amazon Cognito User Pool with custom attributes:
#        - custom:bookingId  (String)
#        - custom:guestName  (String)
#   2. Inject the following environment variable at runtime via:
#        - ECS task definition environment / secrets
#        - EKS: AWS Secrets Store CSI Driver or external-secrets operator
#        - Elastic Beanstalk: .ebextensions sourcing SSM parameters
#
#   COGNITO_USER_POOL_ID  – Amazon Cognito User Pool ID
#                           (e.g. us-east-1_AbCdEfGhI)
#
# The default value is a placeholder — MUST be replaced with a real User Pool ID
# before deploying to any cloud environment.
COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:us-east-1_PLACEHOLDER}
