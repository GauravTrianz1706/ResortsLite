# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables
# (ECS task definition, EKS ConfigMap/Secret, or Elastic Beanstalk environment properties).
# Hard-coded infrastructure values have been removed per cloud readiness requirements.

spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Server port — resolved from SERVER_PORT environment variable at runtime.
# ECS/EKS/Beanstalk injects this dynamically; no hard-coded port (cr-java-0077 fix).
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# AWS Region — resolved from AWS_REGION environment variable.
# Automatically set by ECS task execution role / EC2 instance metadata.
# -----------------------------------------------------------------------
cloud.aws.region.static=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# Amazon S3 — report storage (replaces hard-coded /var/legacy/reports/ path).
# Set REPORTS_S3_BUCKET in ECS task definition or EKS ConfigMap.
# -----------------------------------------------------------------------
cloud.aws.s3.reports-bucket=${REPORTS_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.reports-prefix=${REPORTS_S3_PREFIX:reports/}

# -----------------------------------------------------------------------
# AWS Secrets Manager — database credentials (replaces hard-coded DB_USER/DB_PASS).
# The secret JSON must contain: {"host":"...","username":"...","password":"..."}
# Set DB_SECRET_NAME in ECS task definition or EKS Secret.
# -----------------------------------------------------------------------
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resorts-lite/db-credentials}

# -----------------------------------------------------------------------
# AWS Secrets Manager — authentication credentials (replaces file-based auth).
# The secret JSON must contain: {"provider":"cognito","userPoolId":"...","clientId":"..."}
# -----------------------------------------------------------------------
cloud.aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resorts-lite/auth-credentials}

# -----------------------------------------------------------------------
# Spring DataSource — credentials resolved from environment variables
# populated by ECS secrets injection from AWS Secrets Manager.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session + distributed cache.
# Set REDIS_HOST and REDIS_PORT to the ElastiCache cluster endpoint.
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Spring Session: use Redis for distributed session storage (cr-java-0065 fix)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resorts-lite:session

# -----------------------------------------------------------------------
# Service endpoints — resolved from AWS SSM Parameter Store via environment
# variables (replaces hard-coded internal hostnames — cr-java-0071 fix).
# Set these in ECS task definition or EKS ConfigMap.
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:http://notify.internal:7070/send}
