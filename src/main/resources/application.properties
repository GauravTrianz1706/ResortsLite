# ============================================================
# ResortsLite — Cloud-Native Configuration (AWS)
# ============================================================
# All environment-specific values are injected at runtime via
# environment variables (ECS task definition / Elastic Beanstalk
# environment configuration / EKS ConfigMap+Secrets).
# Hard-coded infrastructure values have been removed.
# ============================================================

spring.application.name=ResortsLite

# ------------------------------------------------------------
# Server Port — injected from environment variable SERVER_PORT
# (populated from AWS SSM Parameter Store at deployment time).
# Replaces hard-coded server.port=8080 (cr-java-0077).
# ------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------
# DataSource — credentials injected from environment variables
# populated by AWS Secrets Manager at deployment time.
# Replaces hard-coded DB hostname and credentials (cr-java-0069).
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session & Cache
# Host/port injected from environment variables populated by
# AWS SSM Parameter Store (cr-java-0065, cr-java-0067).
# ------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session: use Redis as the session store (cr-java-0065)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Spring Cache: use Redis with TTL for distributed caching (cr-java-0067)
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000

# ------------------------------------------------------------
# AWS Region — injected from environment variable AWS_REGION
# ------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ------------------------------------------------------------
# AWS Secrets Manager — secret names for credentials
# Injected from environment variables (cr-java-0069, cr-java-0090)
# ------------------------------------------------------------
aws.secretsmanager.db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}
aws.secretsmanager.payment.secret.name=${PAYMENT_SECRET_NAME:resortslite/payment/endpoint}

# ------------------------------------------------------------
# AWS SSM Parameter Store — parameter names for service URLs
# Injected from environment variables (cr-java-0071, cr-java-0077)
# ------------------------------------------------------------
ssm.parameter.server.port=${SSM_PARAM_SERVER_PORT:/resortslite/server/port}

# ------------------------------------------------------------
# Internal service endpoints — injected from environment variables
# populated from AWS SSM Parameter Store (cr-java-0071).
# Replaces hard-coded internal hostnames.
# ------------------------------------------------------------
app.inventory.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
app.payment.endpoint=${PAYMENT_API_ENDPOINT:http://payment-svc.internal:9090/charge}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:http://notify.internal:7070/send}

# ------------------------------------------------------------
# Amazon S3 — report storage (cr-java-0061, cr-java-0062, cr-java-0063)
# Replaces hard-coded local file paths.
# ------------------------------------------------------------
report.s3.bucket=${REPORT_S3_BUCKET:resorts-lite-reports}
report.s3.prefix=${REPORT_S3_PREFIX:reports/}
