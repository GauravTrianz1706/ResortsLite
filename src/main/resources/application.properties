# ─────────────────────────────────────────────────────────────────────────────
# ResortsLite — GCP Cloud-Ready Configuration
# All sensitive values are externalised to environment variables or
# Google Secret Manager.  Hard-coded infrastructure values have been removed.
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=ResortsLite

# ── Server port ──────────────────────────────────────────────────────────────
# blocker-11 (cr-java-0077): Port is now driven by the SERVER_PORT env var.
# Cloud Run / GKE inject PORT automatically; default to 8080 for local dev.
server.port=${SERVER_PORT:8080}

# ── Datasource ───────────────────────────────────────────────────────────────
# blocker-8/9 (cr-java-0069): Credentials are no longer hard-coded.
# For production, set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD via
# environment variables populated from Google Secret Manager at deploy time.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ── GCP project ──────────────────────────────────────────────────────────────
# Required by Secret Manager client — set GCP_PROJECT_ID in the runtime env.
gcp.project.id=${GCP_PROJECT_ID:my-gcp-project}

# ── Google Cloud Storage ─────────────────────────────────────────────────────
# blocker-1/2/3/4/5/6/7 (cr-java-0061/0062/0063): GCS replaces local file paths.
# Set GCS_BUCKET_NAME, GCS_REPORT_PREFIX, GCS_BACKUP_PREFIX in the runtime env.
gcs.bucket.name=${GCS_BUCKET_NAME:resorts-lite-reports}
gcs.report.prefix=${GCS_REPORT_PREFIX:reports/}
gcs.backup.prefix=${GCS_BACKUP_PREFIX:backups/nightly/}

# ── Redis / Memorystore ───────────────────────────────────────────────────────
# blocker-12/13/14/15/16 (cr-java-0065) and blocker-18 (cr-java-0067):
# Session state and caching are now backed by Google Cloud Memorystore for Redis.
# Set REDIS_HOST and REDIS_PORT to the Memorystore instance values.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Session TTL (minutes) — controls Redis key expiry for session and cache entries.
session.ttl.minutes=${SESSION_TTL_MINUTES:30}

# ── External service endpoints ────────────────────────────────────────────────
# blocker-10 (cr-java-0071): Hard-coded internal URLs replaced with env vars.
# blocker-17 (cr-java-0090): Service-to-service auth uses Cloud IAM / ADC.
app.payment.endpoint=${PAYMENT_API_URL:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}
