# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 [Hard-coded Ports — FIXED]: Port is now resolved from the PORT environment variable
# injected by AWS ECS task definitions, EKS pod specs, or Elastic Beanstalk environment properties.
# AWS Systems Manager Parameter Store can supply the PORT value via the ECS secrets/environment
# injection mechanism (e.g., valueFrom: arn:aws:ssm:<region>:<account>:parameter/resortslite/server/port).
# Falls back to 8080 for local development when PORT is not set.
server.port=${PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061: Amazon S3 configuration — replaces hard-coded absolute file paths.
# Override these values via environment variables in AWS (ECS task definition /
# Elastic Beanstalk environment / Lambda environment variables).
# REPORT_BASE_PATH (/var/legacy/reports/) and BACKUP_PATH (C:\ResortBackups\nightly\)
# are now stored as S3 bucket/prefix references.
cloud.aws.s3.bucket-name=${S3_BUCKET_NAME:resorts-lite-reports}
cloud.aws.s3.backup-prefix=${S3_BACKUP_PREFIX:backups/nightly/}
cloud.aws.region=${AWS_REGION:us-east-1}

# cr-java-0069: AWS Secrets Manager configuration for database credentials.
# Hard-coded DB_USER ("admin") and DB_PASS ("Resort$Pass#2019!") have been removed
# from BookingService.java and are now retrieved at runtime from AWS Secrets Manager.
# Set DB_SECRET_NAME env var to the ARN or name of your Secrets Manager secret.
# The secret must be a JSON object with "username" and "password" keys.
db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}

# cr-java-0065: Spring Session Data Redis — Amazon ElastiCache for Redis configuration.
# HTTP session state is stored in a distributed Redis cluster instead of in-process JVM
# memory, enabling stateless application instances and horizontal scaling without server
# affinity.  Override these values via environment variables in AWS (ECS task definition /
# Elastic Beanstalk environment / Lambda environment variables).
#   REDIS_HOST — ElastiCache primary endpoint hostname
#   REDIS_PORT — ElastiCache port (default 6379)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=${REDIS_SSL:false}

# cr-java-0067: Amazon ElastiCache for Redis — Booking Cache TTL configuration.
# Replaces the unbounded static HashMap in-memory cache (bookingCache) in BookingController.
# Booking entries are stored in Redis with a configurable TTL to ensure controlled expiration,
# prevent indefinite memory growth, and maintain consistent cache state across all instances.
#   BOOKING_CACHE_TTL_MINUTES — TTL in minutes for each booking cache entry (default: 60)
# Override via environment variable in AWS (ECS task definition / Elastic Beanstalk /
# Lambda environment variables) or AWS Systems Manager Parameter Store.
booking.cache.ttl.minutes=${BOOKING_CACHE_TTL_MINUTES:60}

# Redis serialization: ensure RedisTemplate uses JSON serialization for Object values
spring.redis.serializer.value=json
