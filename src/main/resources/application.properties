# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — use environment variable for cloud/container deployments
server.port=${SERVER_PORT:8080}

# ─── PostgreSQL DataSource ────────────────────────────────────────────────────
# Connection string converted from H2 in-memory to PostgreSQL 16.
# All sensitive values are externalised to environment variables so that
# credentials are never committed to source control (replaces hardcoded
# jdbc:h2:mem:resortdb and the hardcoded admin/Resort$Pass#2019! credentials
# that were present in BookingService.java).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Connection Pool (HikariCP) ───────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# Use PostgreSQL dialect for Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Validate schema on startup; use 'update' or 'none' in production
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Log SQL in development; set to false in production
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Use snake_case column naming to match PostgreSQL conventions
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ─── External Service Endpoints ───────────────────────────────────────────────
# Externalised from hardcoded values in BookingService / BookingController
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify-svc:7070/send}
